- name: Simdb Upgrade
  hosts: simdb_VM
  become: true
  vars:
    user_home: "/home/localadmin"
    sim_home: "/home/sim"

  tasks:
    - name: Install Pre-requisites
      ansible.builtin.package:
        name:
          - postgresql
          - nginx
          - openldap
          - sqlite
        state: present

    - name: Stop simdb service
      ansible.builtin.systemd:
        name: simdb
        state: stopped

    - name: Dump Database
      become: true
      become_user: sim
      ansible.builtin.command:
        cmd: >
          pg_dump
          production
          -f /tmp/simdb_prod_{{ ansible_date_time.date }}.sql

    - name: Create virtual env
      ansible.builtin.command:
        cmd: >
          python3 -m venv
          {{ sim_home }}/deployments/simdb_{{ ansible_date_time.date }}

    # - name: Install requirements
    #   ansible.builtin.pip:
    #     requirements: "{{ sim_home }}/deployments/simdb/requirements.txt"
    #     virtualenv: "{{ sim_home }}/deployments/simdb_{{ ansible_date_time.date }}"

    - name: Upgrade simdb
      ansible.builtin.pip:
        name: git+https://git.ccfe.ac.uk/imas/simdb[server]
        state: latest
        virtualenv: "{{ sim_home }}/deployments/simdb_{{ ansible_date_time.date }}"

    - name: SimLink Current folder
      ansible.builtin.file:
        src: "{{ sim_home }}/deployments/simdb_{{ ansible_date_time.date }}"
        dest: "{{ sim_home }}/deployments/current"
        state: link
        force: true

    - name: Restart simdb service
      ansible.builtin.systemd:
        name: simdb
        state: restarted

    - name: Restart nginx service
      ansible.builtin.systemd:
        name: nginx
        state: restarted
