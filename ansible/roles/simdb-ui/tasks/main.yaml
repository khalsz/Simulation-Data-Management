- name: Create UI directory
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.file:
    path: "{{ simdb_ui_root }}"
    state: directory
    owner: sim
    group: sim
    mode: "0755"

- name: Create releases directory
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.file:
    path: "{{ simdb_ui_root }}/releases"
    state: directory
    owner: sim
    group: sim
    mode: "0755"

- name: Download SimDB UI artifact
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.get_url:
    url: "{{ simdb_ui_artifact_url }}"
    dest: "{{ simdb_ui_root }}/releases/{{ release }}.zip"
    headers:
      PRIVATE-TOKEN: "{{ simdb_ui_gitlab_token }}"

- name: Create release directory
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.file:
    path: "{{ simdb_ui_root }}/releases/{{ release }}"
    state: directory
    owner: sim
    group: sim
    mode: "0755"

- name: Extract SimDB UI artifact
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.unarchive:
    src: "{{ simdb_ui_root }}/releases/{{ release }}.zip"
    dest: "{{ simdb_ui_root }}/releases/{{ release }}"
    remote_src: true
    owner: sim
    group: sim
    mode: "0755"

- name: Create release symlink
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.file:
    src: "{{ simdb_ui_root }}/releases/{{ release }}/build/{{ 'dev' if target == 'develop' else 'prod' }}"
    dest: "{{ simdb_ui_root }}/current"
    state: link

- name: Install nginx script
  ansible.builtin.template:
    src: ./nginx_ui.conf.j2
    dest: /etc/nginx/conf.d/simdb.d/ui.conf

- name: Reload systemd daemon
  ansible.builtin.command: sudo systemctl daemon-reload
  changed_when: true

- name: Enable Nginx service
  ansible.builtin.command: sudo systemctl enable nginx
  changed_when: true

- name: Restart Nginx service
  ansible.builtin.command: sudo systemctl restart nginx
  changed_when: true

