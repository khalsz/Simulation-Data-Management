# -----------------------------------------------------------------------------
# Check SimDB UI

- name: Validate SimDB UI
  ansible.builtin.uri:
    url: https://localhost/
    validate_certs: false
    return_content: true
  register: simdb_ui

- name: Assert SimDB UI is correct
  ansible.builtin.assert:
    that:
      - simdb_ui.status == 200
      - "'<title>SimDB</title>' in simdb_ui.content"
