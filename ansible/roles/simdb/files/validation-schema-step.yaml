StudyID:
  required: true
  type: integer

ModelID:
  required: true
  type: integer

Description:
  required: true
  type: string

Comments:
  required: false
  type: string

User:
  required: true
  type: string

security:
  type: dict
  required: true
  schema:
    baseline:
      type: string
      required: true
      allowed:
      - OFFICIAL
      - OFFICIAL SENSITIVE
    ip_sensitive:
      type: boolean
      required: true
    export_controlled:
      type: boolean
      required: true
