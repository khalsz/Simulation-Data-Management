---
- name: Restart SimDB Service
  become: true
  ansible.builtin.command: 
    cmd: systemctl restart simdb
  changed_when: true

- name: Restart Nginx Service
  become: true
  ansible.builtin.command: 
    cmd: systemctl restart nginx
  changed_when: true


- name: Reload PostgreSQL Service
  ansible.builtin.systemd_service:
    name: postgresql
    state: reloaded
  become: true