---
- name: Reload systemd daemon
  ansible.builtin.command: sudo systemctl daemon-reload
  changed_when: true

# - name: Restart SimDB Service
#   ansible.builtin.systemd_service:
#     name: simdb
#     state: restarted
#     enabled: true
#   become: true

- name: Enable SimDB service
  ansible.builtin.command: sudo systemctl enable simdb
  changed_when: true

- name: Restart SimDB service
  ansible.builtin.command: sudo systemctl restart simdb
  changed_when: true


# - name: Restart Nginx Service
#   ansible.builtin.systemd_service:
#     name: nginx
#     state: restarted
#     enabled: true
#   become: true

- name: Enable Nginx service
  ansible.builtin.command: sudo systemctl enable nginx
  changed_when: true

- name: Restart Nginx service
  ansible.builtin.command: sudo systemctl restart nginx
  changed_when: true


- name: Reload PostgreSQL service
  ansible.builtin.systemd_service:
    name: postgresql
    state: reloaded
  become: true