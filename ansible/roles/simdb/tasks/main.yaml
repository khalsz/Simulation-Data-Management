# -----------------------------------------------------------------------------
- name: Create SimDB nginx config directory
  become: true
  ansible.builtin.file:
    path: /etc/nginx/conf.d/simdb.d
    state: directory
    mode: "0755"

# Nginx configuration
- name: Install nginx site configuration
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: 0644
  loop:
    - { src: './nginx_simdb.conf.j2', dest: '/etc/nginx/conf.d/simdb.conf' }
    - { src: './nginx_api.conf.j2', dest: '/etc/nginx/conf.d/simdb.d/api.conf' }
  notify: 
    - Restart Nginx Service
    - Enable Nginx service

# -----------------------------------------------------------------------------
# PostgreSQL database setup
- name: Set database password encryption
  become: true
  become_user: postgres
  community.postgresql.postgresql_alter_system:
    param: password_encryption
    value: "scram-sha-256"

- name: Create the simdb user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: simdb
    password: "{{ db_password }}"
    state: present
    comment: SimDB service account

- name: Create the simdb admin user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: simdb_admin
    password: "{{ db_admin_password }}"
    state: present
    comment: SimDB admin account

- name: Create a new database with name "simdb"
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: simdb
    owner: simdb_admin
    state: present
    comment: SimDB database

- name: Add users to pg_hba.conf
  become: true
  become_user: postgres
  ansible.builtin.lineinfile:
    path: /data/pgsql/data/pg_hba.conf
    line: "host    simdb           {{ item }}           127.0.0.1/32               scram-sha-256"
    state: present
    insertafter: "^# Other local users (use password instead of trust)"
  loop:
    - simdb
    - simdb_admin
  notify: Reload PostgreSQL service

- name: Install pgpass file
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.template:
    src: ./pgpass.j2
    dest: "{{ sim_home }}/.pgpass"
    mode: "0600"

# -----------------------------------------------------------------------------
# Alembic migrations
# - needed while migrations are not pip installed

- name: Git checkout
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.git:
    repo: "{{ simdb_git_repo }}"
    dest: "{{ install_home }}/current/simdb"
    version: "{{ simdb_git_version }}"

# should run Alembic on when the repo pulled have Alembic file
# this will be removed when all repo and branches have Alembic
- name: Check Alembic directory
  ansible.builtin.stat:
    path: "{{ install_home }}/current/simdb/alembic"
  register: alembic_dir_stat

- name: Copy Alembic files
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ install_home }}/current"
    remote_src: yes
    mode: preserve
  loop:
    - "{{ install_home }}/current/simdb/alembic.ini"
    - "{{ install_home }}/current/simdb/alembic"
  when: alembic_dir_stat.stat.exists
  register: copy_alembic_dir

- name: Run Alembic migrations
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.command: "{{ install_home }}/current/bin/alembic upgrade head"
  args:
    chdir: "{{ install_home }}/current"
  environment:
    DATABASE_URL: postgresql://simdb_admin:{{ db_admin_password }}@localhost/simdb

# -----------------------------------------------------------------------------
# PostgreSQL database simdb user privileges (after possible schema updates)

- name: Set privileges for the simdb user - tables
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    login_db: simdb
    schema: public
    objs: ALL_IN_SCHEMA
    type: table
    roles: simdb
    privs: SELECT,INSERT,UPDATE,DELETE
    state: present

- name: Set privileges for the simdb user - sequences
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    login_db: simdb
    schema: public
    objs: ALL_IN_SCHEMA
    type: sequence
    roles: simdb
    privs: USAGE,SELECT,UPDATE
    state: present

# -----------------------------------------------------------------------------
# Simdb log set up

- name: Create SimDB logs directory
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.file:
    path: "{{ install_home }}/logs"
    state: directory
    owner: "{{ simdb_user }}"
    group: "{{ simdb_user }}"
    mode: "0755"

