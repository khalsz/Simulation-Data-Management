- name: Pip install simdb
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.pip:
    name: "{{ item }}"
    #latest tries to reinstall, since we already specified the exact one we want, 
    # should only install if the version changes. 
    state: present 
    virtualenv: "{{ install_home }}/releases/{{ simdb_git_version }}"
    # virtualenv_command: /usr/bin/python3 -m venv
    # move to python3.14 when SimDB has migrated to newer flask version
    virtualenv_command: /usr/bin/{{ python_version }} -m venv  # may be we let people specify the python version they want. 
                                  # python3.14 was having conflict with the Werkzeug library in main branch.
  loop:
    - "{{ simdb_pip_package }}"
    - gunicorn

- name: Create release symlink
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.file:
    src: "{{ install_home }}/releases/{{ simdb_git_version }}"
    dest: "{{ install_home }}/current"
    state: link

- name: Create config directory
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.file:
    path: "{{ sim_home }}/.config/simdb"
    state: directory
    owner: sim
    mode: "0700"

- name: Install server config file
  become: true
  become_user: "{{ simdb_user }}"
  vars:
    secret_token: "{{ lookup('ansible.builtin.password', 'credentials/' + target + '/secret_token', chars=['hex'], length=32) }}"
    admin_password: "{{ lookup('ansible.builtin.password', 'credentials/' + target + '/admin_password', chars=['ascii_letters', 'digits', 'punctuation'], length=16) }}"
  ansible.builtin.template:
    src: "./app-{{ target }}.cfg.j2"
    dest: "{{ install_home }}/current/app.cfg"
    owner: sim
    mode: "0600"
    backup: yes

- name: Create validation directory
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.file:
    path: "{{ install_home }}/current/validation"
    state: directory
    owner: sim
    mode: "0700"

- name: Install validation files
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ install_home }}/current/validation/"
    owner: sim
  with_fileglob:
    - "validation*.yaml"

# -----------------------------------------------------------------------------
- name: Install SimDB systemd service
  ansible.builtin.template:
    src: simdb.service.j2
    dest: /etc/systemd/system/simdb.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd daemon
    - Restart SimDB Service
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
- name: Create SimDB nginx config directory
  become: true
  ansible.builtin.file:
    path: /etc/nginx/conf.d/simdb.d
    state: directory
    mode: "0755"

# Nginx configuration
- name: Install nginx site configuration
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: 0644
  loop:
    - { src: './nginx_simdb.conf.j2', dest: '/etc/nginx/conf.d/simdb.conf' }
    - { src: './nginx_api.conf.j2', dest: '/etc/nginx/conf.d/simdb.d/api.conf' }
  notify: Restart Nginx Service

# -----------------------------------------------------------------------------
# PostgreSQL database setup
- name: Set database password encryption
  become: true
  become_user: postgres
  community.postgresql.postgresql_alter_system:
    param: password_encryption
    value: "scram-sha-256"

- name: Create the simdb user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    login_db: postgres
    name: simdb
    password: "{{ db_password }}"
    comment: SimDB service account

- name: Create database owned by "simdb"
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: simdb
    owner: simdb
    comment: SimDB database

- name: Add simdb user to pg_hba.conf
  become: true
  become_user: postgres
  ansible.builtin.lineinfile:
    path: /data/pgsql/data/pg_hba.conf
    line: "host    simdb           simdb           0.0.0.0/0               scram-sha-256"
    state: present
    insertafter: "^# Other local users (use password instead of trust)"
  notify: Reload PostgreSQL service

- name: Install pgpass file
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.template:
    src: ./pgpass.j2
    dest: "{{ sim_home }}/.pgpass"
    mode: "0600"

# -----------------------------------------------------------------------------
# Alembic migrations
# - needed while migrations are not pip installed

- name: Git checkout
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.git:
    repo: "{{ simdb_git_repo }}"
    dest: "{{ install_home }}/current/simdb"
    version: "{{ simdb_git_version }}"

# should run Alembic on when the repo pulled have Alembic file
- name: Check Alembic directory
  ansible.builtin.stat:
    path: "{{ install_home }}/current/simdb/alembic"
  register: alembic_dir_stat

- name: Copy Alembic files
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ install_home }}/current"
    remote_src: yes
    mode: preserve
  loop:
    - "{{ install_home }}/current/simdb/alembic.ini"
    - "{{ install_home }}/current/simdb/alembic"
  when: alembic_dir_stat.stat.exists
  register: copy_alembic_dir

- name: Run Alembic migrations
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.command: "{{ install_home }}/current/bin/alembic upgrade head"
  args:
    chdir: "{{ install_home }}/current"
  environment:
    DATABASE_URL: postgresql://simdb@localhost/simdb
  when:
    - alembic_dir_stat.stat.exists
    - copy_alembic_dir

# -----------------------------------------------------------------------------
# Simdb log set up

- name: Create SimDB logs directory
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.file:
    path: "{{ install_home }}/logs"
    state: directory
    owner: "{{ simdb_user }}"
    group: "{{ simdb_user }}"
    mode: "0755"

# -----------------------------------------------------------------------------
# Database backup

- name: Ensure a job that runs at 03:00 exists to backup the database"
  become: true
  become_user: "{{ simdb_user }}"
  ansible.builtin.cron:
    name: "backup database"
    minute: "0"
    hour: "3"
    job: "/home/localadmin/db_backup.sh"

# -----------------------------------------------------------------------------
# Check SimDB service

- name: Check SimDB service
  ansible.builtin.uri:
    url: "http://localhost:{{ simdb_port }}"
    method: GET
    return_content: true
  register: result

- name: Print SimDB service version
  ansible.builtin.debug:
  # for now server_version might not exist in the index page result (if main branch)
    msg: "Installed SimDB server version: {{ result.json }}"

- name: Check nginx proxy
  ansible.builtin.uri:
    url: "https://localhost/api/"
    method: GET
    validate_certs: false
    return_content: true
  register: nginx_simdb

- name: Assert nginx proxy is correct
  ansible.builtin.assert:
    that:
  # for now server_version might not exist in the index page result (if main branch)
      - nginx_simdb.status == 200
      # - "'server_version' in nginx_simdb.json"
