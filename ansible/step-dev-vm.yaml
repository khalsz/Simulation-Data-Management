# Configuring a clean Rocky 9.8 VM for step-simdb development

- name: Configure VM
  hosts: local_vm
  tasks:
# -----------------------------------------------------------------------------
# Package installation
    - name: Install dependencies
      ansible.builtin.package:
        name:
          - gcc
          - openldap-devel
          - openssl-devel
          - python3-devel
          - python3.14-devel
          - nginx
          - git
          - postgresql-server
          - unzip
          # only needed for dev server
          - sqlite
          # only needed for test VM
          - python3-cryptography
          - python3-packaging
          - python3-psycopg2
          - libxcrypt
        state: present
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Create directories
    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - /opt/simdb
        - /common/step-simdb
        - /common/step-simdb/dev-simulations
        - /common/step-simdb/db-backups
        - /data/sim
        - /data/pgsql
        - /data/pgsql/data

    - name: Set SELinux context for PostgreSQL data directory
      community.general.sefcontext:
        target: '/data/pgsql(/.*)?'
        setype: postgresql_db_t
        state: present

    - name: Apply SELinux context
      ansible.builtin.command: restorecon -Rv /data/pgsql
      changed_when: false

    - name: Create systemd scripts
      ansible.builtin.copy:
        content: ""
        dest: /etc/systemd/system/simdb.service
        mode: '0644'
        force: false

# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Localadmin user

    - name: Create group
      ansible.builtin.group:
        name: localadmin
        state: present

    - name: Create localadmin user
      ansible.builtin.user:
        name: localadmin
        group: localadmin
        password: "{{ localadmin_password | password_hash('sha512', 'mysecretsalt') }}"
        state: present

    - name: Change /data/sim to user localadmin
      become: yes
      ansible.builtin.file:
        path: /data/sim
        owner: localadmin
        group: root
        state: directory
        recurse: yes

    - name: Set localadmin ACL
      ansible.posix.acl:
        path: /etc/nginx
        entity: localadmin
        etype: user
        permissions: rwx
        recursive: true
        state: present

    - name: Set localadmin ACL
      ansible.posix.acl:
        path: /etc/systemd/system/simdb.service
        entity: localadmin
        etype: user
        permissions: rw
        state: present

    - name: Set localadmin ACL
      ansible.posix.acl:
        path: "{{ item }}"
        entity: localadmin
        etype: user
        permissions: rx
        recursive: true
        state: present
      loop:
        - /opt/simdb
        - /var/log

# -----------------------------------------------------------------------------
# Sim user

    - name: Create sim group
      ansible.builtin.group:
        name: sim
        state: present

    - name: Create sim user
      ansible.builtin.user:
        name: sim
        group: sim
        state: present

    - name: Change directories to user sim
      ansible.builtin.file:
        path: "{{ item }}"
        owner: sim
        group: root
        state: directory
        recurse: yes
      loop:
        - /opt/simdb
        - /common/step-simdb
        - /common/step-simdb/dev-simulations
        - /common/step-simdb/db-backups

    # Directory that both sim and localadmin users have read/write access to
    - name: Set ACL for /data/sim
      ansible.posix.acl:
        path: /data/sim
        entity: "{{ item }}"
        etype: user
        permissions: rw
        default: true
        state: present
      loop:
        - sim
        - localadmin

# -----------------------------------------------------------------------------
# Postgres user

    - name: Change /data/pgsql to user postgres
      become: yes
      ansible.builtin.file:
        path: /data/pgsql
        owner: postgres
        group: postgres
        state: directory
        recurse: yes

    - name: Create PostgreSQL override directory
      ansible.builtin.file:
        path: /etc/systemd/system/postgresql.service.d
        state: directory
        recurse: yes

    - name: Create PostgreSQL override file
      ansible.builtin.copy:
        dest: /etc/systemd/system/postgresql.service.d/override.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          Environment=PGDATA=/data/pgsql/data

    - name: Run PostgreSQL setup
      ansible.builtin.shell:
        cmd: /usr/bin/postgresql-setup --initdb
        creates: /data/pgsql/data/postgresql.conf

    - name: Write pg_hba.conf
      ansible.builtin.copy:
        dest: /data/pgsql/data/pg_hba.conf
        owner: postgres
        group: postgres
        mode: '0600'
        content: |
          # SIGHUP signal.  If you edit the file on a running system, you have to
          # SIGHUP the server for the changes to take effect, run "pg_ctl reload",
          # or execute "SELECT pg_reload_conf()".
          #
          # Put your actual configuration here
          # ----------------------------------
          #
          # If you want to allow non-local connections, you need to add more
          # "host" records.  In that case you will also need to make PostgreSQL
          # listen on a non-local interface via the listen_addresses
          # configuration parameter, or via the -i or -h command line switches.

          # CAUTION: Configuring the system for local "trust" authentication
          # allows any local user to connect as any PostgreSQL user, including
          # the database superuser.  If you do not trust all your local users,
          # use another authentication method.

          # TYPE  DATABASE        USER            ADDRESS                 METHOD

          # Restrict postgres user (CRITICAL LINE)
          # Only OS user "postgres" can connect as DB user "postgres"
          local   all             postgres                                peer
          # Don't allow remote  connection as DB user "postgres"
          host    all             postgres        0.0.0.0/0               reject

          # ----------------------------------------
          # Other local users (use password instead of trust)
          local   all             all                                     scram-sha-256

          # ----------------------------------------
          # Localhost connections (require password)
          host    all             all             127.0.0.1/32            scram-sha-256
          host    all             all             ::1/128                 scram-sha-256

          # ----------------------------------------
          # Replication (secure it too)
          local   replication     all                                     scram-sha-256
          host    replication     all             127.0.0.1/32            scram-sha-256
          host    replication     all             ::1/128                 scram-sha-256

    - name: Enable postgresql service
      become: true
      ansible.builtin.systemd_service:
        name: postgresql
        enabled: true
        state: restarted
        daemon_reload: true

# -----------------------------------------------------------------------------

    - name: Copy sudoers file
      ansible.builtin.copy:
        src: sudoers
        dest: /etc/sudoers.d/localadmin
        owner: root
        group: root
        mode: '0644'

    - name: Create private key (RSA, 4096 bits)
      community.crypto.openssl_privatekey:
        path: /etc/pki/tls/private/server.key

    - name: Create simple self-signed certificate
      community.crypto.x509_certificate:
        path: /etc/pki/tls/certs/server.pem
        privatekey_path: /etc/pki/tls/private/server.key
        provider: selfsigned
