simdb_VM:
  hosts:
    # ------------------------------------------------------------------------------------------------------------------
    # Development VM
    step-simdb-dev.apps.l:
      target: develop

      # Ansible connection details
      ansible_host: step-simdb-dev.apps.l
      ansible_ssh_pass: "{{ dev_vm_password }}"
      ansible_become_pass: "{{ dev_vm_password }}"

      # System Info
      data_home: /common/step-simdb/dev-simulations
      ssl_cert: /etc/pki/tls/certs/step-simdb-dev.apps.l.pem
      ssl_cert_key: /etc/pki/tls/private/step-simdb-dev.apps.l.key
      db_password: "{{ dev_db_password }}"
      db_admin_password: "{{ dev_db_admin_password }}"

      # SimDB
      simdb_git_repo: https://gitlab-project-token:{{ simdb_git_token }}@gitlab.ukaea.uk/step/simulation-data-management/simdb.git
      simdb_pip_package: >-
        imas-simdb[server,auth-okta,postgres]
        @ git+{{ simdb_git_repo }}@{{ simdb_git_version }}

      # SimDB UI
      simdb_ui_artifact_url: "https://gitlab.ukaea.uk/api/v4/projects/20155/jobs/artifacts/master/download?job=build"
      simdb_ui_git_version: a8a0915a

    # ------------------------------------------------------------------------------------------------------------------
    # Production VM
    step-simdb-prod.apps.l:
      target: prod

      # Ansible connection details
      ansible_host: step-simdb-prod.apps.l
      ansible_ssh_pass: "{{ prod_vm_password }}"
      ansible_become_pass: "{{ prod_vm_password }}"

      # System Info
      data_home: /common/step-simdb/simulations
      ssl_cert: /etc/pki/tls/certs/simdb-prod.apps.l.pem
      ssl_cert_key: /etc/pki/tls/private/simdb-prod.apps.l.key
      db_password: "{{ prod_db_password }}"
      db_admin_password: "{{ prod_db_admin_password }}"

      # SimDB
      simdb_git_repo: https://gitlab-project-token:{{ simdb_git_token }}@gitlab.ukaea.uk/step/simulation-data-management/simdb.git
      simdb_pip_package: >-
        imas-simdb[server,auth-ad,postgres]
        @ git+{{ simdb_git_repo }}@{{ simdb_git_version }}

      # SimDB UI
      simdb_ui_artifact_url: "https://gitlab.ukaea.uk/api/v4/projects/20155/jobs/artifacts/master/download?job=build"
      simdb_ui_git_version: a8a0915a
    
    # Maintainers
    postgres_maintainers:
      - andrewlahiff
      - jonathanhollocombe
      - tonycantone
      - javidahmed
      - vishnupriyananantharaman
  vars:
    python_version: python3.9
    ansible_connection: ssh
    ansible_user: localadmin
    ansible_python_interpreter: /usr/bin/python3
    db_backup_dir: /common/step-simdb/db-backups
    simdb_user: sim
    simdb_git_version: 994f8f503d0c748ce47a51f45d48268a45c78521
    domain_name: simdb-dev.apps.l
    postgresql_data_dir: /var/lib/pgsql/data/