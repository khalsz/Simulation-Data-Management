- name: Simdb Upgrade
  hosts: simdb_VM
  become: false
  vars:
    user_home: "/home/localadmin"
    sim_home: "/home/sim"
    install_home: "/opt/simdb"
    data_home: "/common/step-simdb"
    db_password: "{{ lookup('password', 'credentials/{{ target }}/db_password', chars=['ascii_letters', 'digits', 'punctuation'], length=16) }}"
    release: "{{ lookup('pipe', 'date +%Y-%m-%d') }}"
    # release: 0.15.3

  tasks:
    - name: Create virtual enviroment
      ansible.builtin.pip:
        virtualenv: "{{ install_home }}/releases/{{ release }}"
        virtualenv_python: python3
        state: present

    - name: Pip install simdb
      ansible.builtin.pip:
        name: "{{ item }}"
        state: latest
        virtualenv: "{{ install_home }}/releases/{{ release }}"
      loop:
        - "{{ simdb_pip_package }}"
        - gunicorn

    - name: Create release symlink
      become: true
      become_user: sim
      ansible.builtin.file:
        src: "{{ install_home }}/releases/{{ release }}"
        dest: "{{ install_home }}/current"
        state: link

    - name: Install server config file
      become: true
      become_user: sim
      vars:
        secret_token: "{{ lookup('password', 'credentials/{{ target }}/secret_token', chars=['hex'], length=32) }}"
        admin_password: "{{ lookup('password', 'credentials/{{ target }}/admin_password', chars=['ascii_letters', 'digits', 'punctuation'], length=16) }}"
      ansible.builtin.template:
        src: "./app-{{ target }}.cfg"
        dest: "{{ sim_home }}/.config/simdb/app.cfg"
        owner: sim
        mode: "0644"
        backup: yes

    - name: Install validation files
      become: true
      become_user: sim
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ sim_home }}/.config/simdb/"
        owner: sim
      with_fileglob:
        - "validation*.yaml"

    - name: Install service script
      become: true
      ansible.builtin.copy:
        src: ./simdb.service
        dest: /etc/systemd/system/simdb.service

    - name: Install nginx script
      become: true
      ansible.builtin.copy:
        src: ./nginx_simdb.conf
        dest: /etc/nginx/conf.d/simdb.conf

    - name: Enable service nginx
      become: true
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Enable service simdb
      become: true
      ansible.builtin.systemd_service:
        name: simdb
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Set database password encryption
      become: true
      become_user: postgres
      community.postgresql.postgresql_alter_system:
        param: password_encryption
        value: "scram-sha-256"

    - name: Create a new database with name "simdb"
      become: true
      become_user: postgres
      community.postgresql.postgresql_db:
        name: simdb
        comment: SimDB database

    - name: Create the simdb user
      become: true
      become_user: postgres
      community.postgresql.postgresql_user:
        login_db: simdb
        name: simdb
        password: "{{ db_password }}"
        comment: SimDB service account

    - name: Change simdb db owner
      become: true
      become_user: postgres
      community.postgresql.postgresql_owner:
        name: simdb
        owner: simdb
        login_db: simdb

    - name: Install pgpass file
      become: true
      become_user: sim
      ansible.builtin.template:
        src: ./pgpass
        dest: "{{ sim_home }}/.pgpass"
        mode: "0600"

    - name: Ensure a job that runs at 03:00 exists to backup the database"
      become: true
      become_user: sim
      ansible.builtin.cron:
        name: "backup database"
        minute: "0"
        hour: "3"
        job: "/home/localadmin/db_backup.sh"

    - name: Clone UI
      become: true
      become_user: sim
      ansible.builtin.git:
        repo: git@gitlab.ukaea.uk:step/simulation-data-management/simdb-ui.git
        dest: "{{ install_home }}/ui/releases/{{ release }}"
        single_branch: yes
        version: master

    # - name: Download UI tarball
    #   become: true
    #   become_user: sim
    #   get_url:
    #     url: https://gitlab.ukaea.uk/step/simulation-data-management/simdb-ui/-/archive/master/simdb-ui-master.tar.gz
    #     dest: /opt/simdb/simdb-ui-master.tar.gz

    - name: Install nvm
      become: true
      become_user: sim
      ansible.builtin.shell: |
        mkdir -p /opt/simdb.nvm
        export NVM_DIR=/opt/simdb/.nvm
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.5/install.sh | bash
      creates: "/opt/simdb/.nvm/nvm.sh"

    - name: Install npm
      become: true
      become_user: sim
      ansible.builtin.shell: |
        export NVM_DIR=/opt/simdb/.nvm
        source $NVM_DIR/nvm.sh
        nvm install 24
      creates: "/opt/simdb/.nvm/versions/node/v24*/bin/npm"

    - name: Install UI env file
      become: true
      become_user: sim
      vars:
        secret_token: "{{ lookup('password', 'credentials/{{ target }}/ui/secret_token', chars=['hex'], length=32) }}"
      ansible.builtin.template:
        src: ./env.local
        dest: "{{ install_home }}/ui/releases/{{ release }}/.env.local"

    - name: Install UI
      become: true
      become_user: sim
      ansible.builtin.shell: |
        cd {{ install_home }}/ui/releases/{{ release }}
        npm install
        npm run build
      creates: "{{ install_home }}/ui/releases/{{ release }}/node_modules"

    - name: Create UI release symlink
      become: true
      become_user: sim
      ansible.builtin.file:
        src: "{{ install_home }}/ui/releases/{{ release }}"
        dest: "{{ install_home }}/ui/current"
        state: link
