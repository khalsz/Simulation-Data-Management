client_max_body_size 20000M;

server {
    listen 443 ssl;
    server_name localhost; # or the address of the server you are running

    # Use only TLS
    ssl_protocols TLSv1.1 TLSv1.2;

    # Tell client which ciphers are available
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDH+AESGCM:ECDH+AES256:ECDH+AES128:DH+3DES:!ADH:!AECDH:!MD5;

    # Certificates
    ssl_certificate      /etc/pki/tls/certs/step-simdb-dev.apps.l.pem;
    ssl_certificate_key  /etc/pki/tls/private/step-simdb-dev.apps.l.key;

    location /api/ {
        proxy_pass http://localhost:8080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;

        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        send_timeout 600;
    }

    location /ui {
        proxy_pass http://localhost:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        send_timeout 600;
    }
}

server {
    if ($host = simdb.step.ukaea.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen        80;
    server_name   simdb.step.ukaea.uk;
    return 404; # managed by Certbot
}
