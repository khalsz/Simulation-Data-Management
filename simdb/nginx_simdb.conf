client_max_body_size 20000M;

server {
    listen 443 ssl;
    server_name localhost; # or the address of the server you are running

    # Use only TLS
    ssl_protocols TLSv1.1 TLSv1.2;

    # Tell client which ciphers are available
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDH+AESGCM:ECDH+AES256:ECDH+AES128:DH+3DES:!ADH:!AECDH:!MD5;

    # Certificates
    ssl_certificate      /etc/pki/tls/certs/step-simdb-dev.apps.l.pem;
    ssl_certificate      /etc/pki/tls/private/step-simdb-dev.apps.l.key;

    location / {
        include proxy_params;
        proxy_pass http://unix:/var/run/simdb.sock;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        send_timeout 600;
    }

    location /ui {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        send_timeout 600;
    }

    location /search {
        include proxy_params;
        proxy_pass http://unix:/var/run/simdbweb.sock;
    }

    location /alias {
        include proxy_params;
        proxy_pass http://unix:/var/run/simdbweb.sock;
    }

    location /uuid {
        include proxy_params;
        proxy_pass http://unix:/var/run/simdbweb.sock;
    }

    location /data {
        include proxy_params;
        proxy_pass http://unix:/var/run/simdbweb.sock;
        proxy_read_timeout 6000;
        proxy_connect_timeout 6000;
        proxy_send_timeout 6000;
        send_timeout 6000;
        proxy_request_buffering off;
    }

    location /login {
        include proxy_params;
        proxy_pass http://unix:/var/run/simdbweb.sock;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        send_timeout 600;
    }

    location /logout {
        include proxy_params;
        proxy_pass http://unix:/var/run/simdbweb.sock;
    }

    location /create {
        include proxy_params;
        proxy_pass http://unix:/var/run/simdbweb.sock;
    }

    location /images {
        include proxy_params;
        proxy_pass http://unix:/var/run/simdbweb.sock;
    }
}

server {
    if ($host = simdb.step.ukaea.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen        80;
    server_name   simdb.step.ukaea.uk;
    return 404; # managed by Certbot
}
